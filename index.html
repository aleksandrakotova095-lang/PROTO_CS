<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CS2 — Визитка игрока</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #E4871B;
      --accent-glow: rgba(228, 135, 27, 0.35);
      --bg-dark: #0b0d10;
      --card-bg: rgba(15, 18, 24, 0.84);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    /* Фоновая картинка Img/fon.jpg + затемнение */
    .bg-image {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: 
        linear-gradient(135deg, rgba(10, 12, 16, 0.85) 0%, rgba(14, 17, 23, 0.78) 50%, rgba(10, 12, 16, 0.92) 100%),
        url('Img/fon.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.02);
    }

    /* Тактическая сетка CS2 */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 35%, rgba(0, 0, 0, 0.35) 100%);
      -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 35%, rgba(0, 0, 0, 0.35) 100%);
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, var(--accent-glow), transparent 60%);
      opacity: 0.35;
    }

    /* Верхняя панель управления */
    .top-bar {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 20;
      display: flex;
      gap: 10px;
    }

    .btn-hud {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      background: rgba(16, 20, 27, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
    }

    .btn-hud:hover {
      border-color: var(--accent);
      background: rgba(25, 30, 40, 0.94);
      color: #fff;
    }

    .btn-hud.accent {
      background: var(--accent);
      border-color: var(--accent);
      color: #0b0d10;
    }

    .btn-hud.accent:hover {
      filter: brightness(1.1);
    }

    /* Центрированный контейнер */
    .viewport {
      position: relative;
      z-index: 10;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Карточка-визитка */
    .card {
      position: relative;
      width: 100%;
      max-width: 430px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-top: 3px solid var(--accent);
      padding: 30px 28px 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.78);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
    }

    .card-header-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 22px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #e5e7eb;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .avatar-wrap {
      position: relative;
      width: 86px;
      height: 86px;
      flex-shrink: 0;
      cursor: pointer;
      border: 2px solid var(--accent);
      padding: 3px;
      background: rgba(0, 0, 0, 0.5);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-hint {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      transition: opacity 0.2s;
      padding: 4px;
    }

    .avatar-wrap:hover .avatar-hint {
      opacity: 1;
    }

    .identity {
      min-width: 0;
      flex: 1;
    }

    .nickname {
      font-family: 'Rajdhani', sans-serif;
      font-size: 32px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.03em;
      color: #ffffff;
      word-break: break-word;
    }

    .role-badge {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 8px;
      background: rgba(228, 135, 27, 0.15);
      border-left: 2px solid var(--accent);
      color: var(--accent);
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .bio {
      font-size: 14px;
      line-height: 1.55;
      color: #d1d5db;
      margin-bottom: 24px;
      user-select: text;
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .steam-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 16px;
      background: linear-gradient(90deg, rgba(228, 135, 27, 0.22) 0%, rgba(255, 255, 255, 0.05) 100%);
      border: 1px solid rgba(228, 135, 27, 0.5);
      color: #ffffff;
      text-decoration: none;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .steam-btn:hover {
      background: var(--accent);
      color: #0b0d10;
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .sub-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: #d1d5db;
      text-decoration: none;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .sub-btn:hover {
      border-color: var(--accent);
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Модальное окно */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(5, 7, 10, 0.84);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 410px;
      background: #11151c;
      border: 1px solid var(--border-subtle);
      border-top: 3px solid var(--accent);
      padding: 22px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-family: 'Rajdhani', sans-serif;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .field input, .field textarea, .field select {
      width: 100%;
      padding: 9px 11px;
      background: #0a0d12;
      border: 1px solid var(--border-subtle);
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }

    .field input:focus, .field textarea:focus, .field select:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .modal-actions button {
      flex: 1;
    }

    .toast {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 60;
      background: #141922;
      border: 1px solid var(--accent);
      color: #fff;
      padding: 10px 18px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="bg-image"></div>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <!-- Две кнопки на верхней панели -->
  <div class="top-bar">
    <button class="btn-hud" id="openEditBtn" type="button">Редактировать</button>
    <button class="btn-hud accent" id="shareBtn" type="button">Поделиться</button>
  </div>

  <main class="viewport">
    <section class="card">
      <div class="card-header-tag">
        <span>CS2 // PLAYER CARD</span>
        <span class="status-pill">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">В СЕТИ • PREMIER</span>
        </span>
      </div>

      <div class="profile-main">
        <div class="avatar-wrap" id="avatarTrigger" title="Сменить аватар">
          <img id="avatarImg" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23161b24'/><circle cx='50' cy='38' r='18' fill='%23E4871B'/><path d='M20 88 C20 66, 80 66, 80 88' fill='%23E4871B'/></svg>" alt="Avatar" />
          <div class="avatar-hint">Сменить фото</div>
          <input type="file" id="avatarInput" accept="image/*" hidden />
        </div>

        <div class="identity">
          <h1 class="nickname" id="nickDisplay">VORTEX</h1>
          <div class="role-badge" id="roleDisplay">RIFLER / ENTRY</div>
        </div>
      </div>

      <p class="bio" id="bioDisplay">
        Играю вечерний Premier и FACEIT. Без тильта, чёткая инфа по микрофону. Добавляйтесь в Steam для пати.
      </p>

      <div class="links-stack">
        <a class="steam-btn" id="steamLink" href="https://steamcommunity.com/" target="_blank" rel="noopener noreferrer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0z"/>
          </svg>
          <span>Открыть профиль Steam</span>
        </a>

        <a class="sub-btn" id="tradeLink" href="https://steamcommunity.com/" target="_blank" rel="noopener noreferrer">
          Trade Offer
        </a>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="editModal">
    <div class="modal">
      <h2>Настройка визитки CS2</h2>

      <div class="field">
        <label>Никнейм</label>
        <input type="text" id="inputNick" maxlength="24" />
      </div>

      <div class="field">
        <label>Роль / Звание</label>
        <input type="text" id="inputRole" maxlength="32" />
      </div>

      <div class="field">
        <label>Статус</label>
        <select id="inputStatus">
          <option value="online">В сети • Premier</option>
          <option value="ingame">В матче • CS2</option>
          <option value="offline">Не в сети</option>
        </select>
      </div>

      <div class="field">
        <label>Короткое описание</label>
        <textarea id="inputBio" rows="3" maxlength="160"></textarea>
      </div>

      <div class="field">
        <label>Ссылка на профиль Steam</label>
        <input type="url" id="inputSteam" placeholder="https://steamcommunity.com/id/..." />
      </div>

      <div class="field">
        <label>Ссылка на обмен (Trade URL)</label>
        <input type="url" id="inputTrade" placeholder="https://steamcommunity.com/tradeoffer/new/..." />
      </div>

      <div class="modal-actions">
        <button class="btn-hud" id="closeModalBtn" type="button">Отмена</button>
        <button class="btn-hud accent" id="saveModalBtn" type="button">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Ссылка скопирована</div>

  <script>
    const defaultAvatarSvg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23161b24'/><circle cx='50' cy='38' r='18' fill='%23E4871B'/><path d='M20 88 C20 66, 80 66, 80 88' fill='%23E4871B'/></svg>";

    const defaultData = {
      n: 'VORTEX',
      r: 'RIFLER / ENTRY',
      s: 'online',
      b: 'Играю вечерний Premier и FACEIT. Без тильта, чёткая инфа по микрофону. Добавляйтесь в Steam для пати.',
      u: 'https://steamcommunity.com/',
      t: 'https://steamcommunity.com/',
      a: ''
    };

    let state = { ...defaultData };

    const els = {
      nickDisplay: document.getElementById('nickDisplay'),
      roleDisplay: document.getElementById('roleDisplay'),
      statusDot: document.getElementById('statusDot'),
      statusText: document.getElementById('statusText'),
      bioDisplay: document.getElementById('bioDisplay'),
      steamLink: document.getElementById('steamLink'),
      tradeLink: document.getElementById('tradeLink'),
      avatarImg: document.getElementById('avatarImg'),
      avatarTrigger: document.getElementById('avatarTrigger'),
      avatarInput: document.getElementById('avatarInput'),
      editModal: document.getElementById('editModal'),
      openEditBtn: document.getElementById('openEditBtn'),
      closeModalBtn: document.getElementById('closeModalBtn'),
      saveModalBtn: document.getElementById('saveModalBtn'),
      shareBtn: document.getElementById('shareBtn'),
      toast: document.getElementById('toast'),
      inputNick: document.getElementById('inputNick'),
      inputRole: document.getElementById('inputRole'),
      inputStatus: document.getElementById('inputStatus'),
      inputBio: document.getElementById('inputBio'),
      inputSteam: document.getElementById('inputSteam'),
      inputTrade: document.getElementById('inputTrade')
    };

    function showToast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add('show');
      setTimeout(() => els.toast.classList.remove('show'), 2000);
    }

    function loadState() {
      const saved = localStorage.getItem('cs2_card_local');
      if (saved) {
        try {
          state = { ...defaultData, ...JSON.parse(saved) };
        } catch (e) {}
      }
    }

    function render() {
      els.nickDisplay.textContent = state.n || 'PLAYER';
      els.roleDisplay.textContent = state.r || 'CS2 PLAYER';
      els.bioDisplay.textContent = state.b || '';
      els.steamLink.href = state.u || 'https://steamcommunity.com/';
      els.tradeLink.href = state.t || state.u || 'https://steamcommunity.com/';
      els.avatarImg.src = state.a || defaultAvatarSvg;

      if (state.s === 'ingame') {
        els.statusDot.style.background = '#E4871B';
        els.statusDot.style.boxShadow = '0 0 8px #E4871B';
        els.statusText.textContent = 'В МАТЧЕ • CS2';
      } else if (state.s === 'offline') {
        els.statusDot.style.background = '#6b7280';
        els.statusDot.style.boxShadow = 'none';
        els.statusText.textContent = 'НЕ В СЕТИ';
      } else {
        els.statusDot.style.background = '#22c55e';
        els.statusDot.style.boxShadow = '0 0 8px #22c55e';
        els.statusText.textContent = 'В СЕТИ • PREMIER';
      }
    }

    function persist() {
      localStorage.setItem('cs2_card_local', JSON.stringify(state));
    }

    els.avatarTrigger.addEventListener('click', () => els.avatarInput.click());
    els.avatarInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const size = 96;
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
          state.a = canvas.toDataURL('image/webp', 0.7);
          render();
          persist();
          showToast('Аватар обновлён');
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    els.openEditBtn.addEventListener('click', () => {
      els.inputNick.value = state.n;
      els.inputRole.value = state.r;
      els.inputStatus.value = state.s;
      els.inputBio.value = state.b;
      els.inputSteam.value = state.u;
      els.inputTrade.value = state.t;
      els.editModal.classList.add('open');
    });

    els.closeModalBtn.addEventListener('click', () => {
      els.editModal.classList.remove('open');
    });

    els.saveModalBtn.addEventListener('click', () => {
      state.n = els.inputNick.value.trim() || 'PLAYER';
      state.r = els.inputRole.value.trim() || 'CS2 PLAYER';
      state.s = els.inputStatus.value;
      state.b = els.inputBio.value.trim();
      state.u = els.inputSteam.value.trim() || 'https://steamcommunity.com/';
      state.t = els.inputTrade.value.trim() || state.u;
      render();
      persist();
      els.editModal.classList.remove('open');
      showToast('Сохранено');
    });

    // Кнопка поделиться: копирует чистый адрес страницы без огромных хвостов
    els.shareBtn.addEventListener('click', () => {
      const cleanUrl = window.location.origin + window.location.pathname;
      navigator.clipboard.writeText(cleanUrl).then(() => {
        showToast('Ссылка на сайт скопирована');
      });
    });

    loadState();
    render();
  </script>
</body>
</html>
