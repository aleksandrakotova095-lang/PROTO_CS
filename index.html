<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gamumu — CS2 Player Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent: #E4871B;
      --accent-glow: rgba(228, 135, 27, 0.35);
      --bg-dark: #0b0d10;
      --card-bg: rgba(15, 18, 24, 0.86);
      --border-subtle: rgba(255, 255, 255, 0.1);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* Фоновая картинка Img/fon.jpg + затемнение */
    .bg-image {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: 
        linear-gradient(135deg, rgba(10, 12, 16, 0.85) 0%, rgba(14, 17, 23, 0.78) 50%, rgba(10, 12, 16, 0.92) 100%),
        url('Img/fon.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scale(1.02);
    }

    /* Тактическая сетка CS2 */
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 35%, rgba(0, 0, 0, 0.35) 100%);
      -webkit-mask-image: radial-gradient(circle at center, rgba(0, 0, 0, 1) 35%, rgba(0, 0, 0, 0.35) 100%);
    }

    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, var(--accent-glow), transparent 60%);
      opacity: 0.35;
    }

    /* Центрированный контейнер */
    .viewport {
      position: relative;
      z-index: 10;
      height: 100%;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Карточка-визитка */
    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-top: 3px solid var(--accent);
      padding: 30px 28px 28px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.78);
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%);
    }

    .card-header-tag {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 22px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #e5e7eb;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .profile-main {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }

    .avatar-wrap {
      position: relative;
      width: 88px;
      height: 88px;
      flex-shrink: 0;
      border: 2px solid var(--accent);
      padding: 3px;
      background: rgba(0, 0, 0, 0.5);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .identity {
      min-width: 0;
      flex: 1;
    }

    .nickname {
      font-family: 'Rajdhani', sans-serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.03em;
      color: #ffffff;
      word-break: break-word;
    }

    .real-name {
      font-size: 14px;
      font-weight: 500;
      color: #d1d5db;
      margin-top: 4px;
    }

    .role-badge {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 10px;
      background: rgba(228, 135, 27, 0.15);
      border-left: 2px solid var(--accent);
      color: var(--accent);
      font-family: 'Rajdhani', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .steam-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 16px;
      background: linear-gradient(90deg, rgba(228, 135, 27, 0.22) 0%, rgba(255, 255, 255, 0.05) 100%);
      border: 1px solid rgba(228, 135, 27, 0.5);
      color: #ffffff;
      text-decoration: none;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .steam-btn:hover {
      background: var(--accent);
      color: #0b0d10;
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .faceit-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      color: #e5e7eb;
      text-decoration: none;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .faceit-btn:hover {
      border-color: #ff6600;
      color: #fff;
      background: rgba(255, 102, 0, 0.14);
      transform: translateY(-1px);
    }

    @media (max-width: 420px) {
      .card {
        padding: 24px 20px;
      }
      .avatar-wrap {
        width: 74px;
        height: 74px;
      }
      .nickname {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <div class="bg-image"></div>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <main class="viewport">
    <section class="card">
      <div class="card-header-tag">
        <span>CS2 // PLAYER CARD</span>
        <span class="status-pill">
          <span class="status-dot"></span>
          <span>ACTIVE ROSTER</span>
        </span>
      </div>

      <div class="profile-main">
        <div class="avatar-wrap">
          <!-- Если заказчик пришлёт аватар, замени src на путь к файлу, например Img/avatar.jpg -->
          <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23161b24'/><circle cx='50' cy='38' r='18' fill='%23E4871B'/><path d='M20 88 C20 66, 80 66, 80 88' fill='%23E4871B'/></svg>" alt="Gamumu" />
        </div>

        <div class="identity">
          <h1 class="nickname">Gamumu</h1>
          <div class="real-name">Максим Авдеевич</div>
          <div class="role-badge">RIFLER</div>
        </div>
      </div>

      <div class="links-stack">
        <a class="steam-btn" href="https://steamcommunity.com/profiles/76561199570359453" target="_blank" rel="noopener noreferrer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11.979 0C5.678 0 .511 4.86.022 11.037l6.432 2.658c.545-.371 1.203-.59 1.912-.59.063 0 .125.004.188.006l2.861-4.142V8.91c0-2.495 2.028-4.524 4.524-4.524 2.494 0 4.524 2.031 4.524 4.527s-2.03 4.525-4.524 4.525h-.105l-4.076 2.911c0 .052.004.105.004.159 0 1.875-1.515 3.396-3.39 3.396-1.635 0-3.016-1.173-3.331-2.727L.436 15.27C1.862 20.307 6.486 24 11.979 24c6.627 0 11.999-5.373 11.999-12S18.605 0 11.979 0z"/>
          </svg>
          <span>Профиль Steam</span>
        </a>

        <a class="faceit-btn" href="https://www.faceit.com/ru/players/Gamumu1" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M2.5 2.5v19h19v-19h-19zm15.2 15.2h-11.4v-11.4h11.4v11.4zm-8.7-2.7h2v-6h-2v6zm5 0h2v-6h-2v6z"/>
          </svg>
          <span>Профиль FACEIT</span>
        </a>
      </div>
    </section>
  </main>

</body>
</html>
